name: Check blocks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base-sha:
        description: Base commit for validating a release-please PR
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.20.0', '24.15.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Validate author PR versions
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:versions -- --base "$BASE_SHA"
      - name: Validate release PR versions and scope
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--'))
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base-sha }}
        run: npm run check:versions -- --base "$BASE_SHA" --release
